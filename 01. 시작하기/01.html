<!-- 각 요소 설명 -->
<!-- HT문서가 HTML5 문서임을 선언합니다.-->
<!DOCTYPE html> 
<!-- HTML 문서의 시작과 끝을 나타냅니다.-->
<html>
<!-- 문서의 메타데이터를 포함합니다. 
여기에는 문서 제목, 문자 인코딩, 스타일 시트 링크 등이 들어갑니다. -->
<head>
	<!-- 문서의 문자 인코딩을 UTF-8로 설정합니다. -->
    <meta charset="UTF-8">
	<!-- 브라우저 탭에 표시될 문서 제목을 설정합니다. -->
    <title>기본 HTML 문서</title>
</head>
<!-- 문서의 실제 내용이 들어가는 부분입니다. -->
<body>
    <!-- 문서 내용이 여기 들어갑니다. -->
	<!-- 제목을 나타내는 태그입니다. -->
    <h1>환영합니다!</h1>
	<!-- 단락을 나타내는 태그입니다. -->
    <p>이것은 기본적인 HTML 문서입니다.</p>
</body>
<!-- HTML 문서의 시작과 끝을 나타냅니다.-->
</html>

<!-- 
작성 및 실행 방법
파일 생성: 텍스트 편집기(예: Notepad, Visual Studio Code)에서 새로운 파일을 생성합니다.

HTML 코드 작성: 위의 기본 HTML 구조를 복사하여 파일에 붙여넣습니다.

파일 저장: 파일을 .html 확장자로 저장합니다(예: basic_html.html).

웹 브라우저에서 열기: 저장한 파일을 웹 브라우저에서 열어 실행합니다.
-->
